name: PowerShell Tests

on:
  push:
    paths:
      - 'powershell/**'
      - 'tests/powershell/**'
      - '.github/workflows/powershell-tests.yml'
      - '.github/linters/PSScriptAnalyzerSettings.psd1'
  pull_request:
    paths:
      - 'powershell/**'
      - 'tests/powershell/**'
      - '.github/workflows/powershell-tests.yml'
      - '.github/linters/PSScriptAnalyzerSettings.psd1'
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path powershell -Recurse `
              -Settings .github/linters/PSScriptAnalyzerSettings.psd1 `
              -Severity Error, Warning
          if ($results) {
              $results | Format-Table -AutoSize
              exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues found."

  pester:
    name: Pester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0
      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
